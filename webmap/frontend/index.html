<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>CBU / KRAL Live Aircraft Map</title>
  <link rel="icon" href="data:," />

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link
    href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css"
    rel="stylesheet"
  />
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="map"></div>

  <div id="controls">
    <div id="focal-buttons">
      <button data-focal="overview" class="active">Overview</button>
      <button data-focal="cbu">CBU Campus</button>
      <button data-focal="kral">KRAL Airport</button>
    </div>
    <div id="tilt-hint">Hold middle mouse + drag to tilt for 3D buildings</div>
    <div id="legend">
      <div class="legend-heading">Campus buildings</div>
      <div class="legend-row"><span class="swatch" style="background:#facc15"></span>name + description</div>
      <div class="legend-row"><span class="swatch" style="background:#ef4444"></span>needs description</div>
      <div class="legend-row"><span class="swatch" style="background:#111827"></span>needs a name</div>
    </div>
    <div id="aircraft-list-wrap">
      <div id="aircraft-list-heading">Active Flights</div>
      <div id="aircraft-list">None currently tracked</div>
    </div>
    <div id="status">Loading...</div>
  </div>

  <div id="aircraft-details" class="hidden">
    <button id="details-close" title="Close">&times;</button>
    <div id="details-body"></div>
  </div>

  <div id="weather">
    <div id="weather-header">
      <span id="weather-icao">KRAL</span>
      <span id="weather-category">--</span>
    </div>
    <div id="weather-body">
      <span id="weather-temp">--</span>
      <span id="weather-wind">--</span>
      <span id="weather-vis">--</span>
    </div>
    <div id="weather-updated">Loading weather...</div>
    <div id="weather-overlay-row">
      <span>Radar &amp; clouds</span>
      <button id="weather-overlay-toggle" type="button" aria-pressed="false">Off</button>
    </div>
  </div>

  <script src="/config.js"></script>
  <script src="/app.js"></script>
</body>
</html>
