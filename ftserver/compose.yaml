services:
  freetakserver:
    image: ghcr.io/freetakteam/freetakserver:latest
    hostname: freetakserver
    restart: unless-stopped
    networks:
        taknet:
            ipv4_address: 172.28.0.2
    # Consumer routers commonly mangle the WebSocket upgrade handshake while
    # leaving plain HTTP long-polling alone (confirmed here: raw TCP + HTTP
    # polling to 19023 work fine from a genuinely external client, but the
    # Socket.IO WebSocket upgrade times out every time). Rather than touch
    # router config, disable WS upgrades server-side so every client
    # (including the dashboard's bundled socket.io.js) stays on long-polling,
    # which already works end-to-end through the router.
    command: sh -c "sed -i 's/SocketIO(app, async_handlers=True, async_mode=\"eventlet\")/SocketIO(app, async_handlers=True, async_mode=\"eventlet\", allow_upgrades=False)/' /home/freetak/FreeTAKServer/services/rest_api_service/rest_api_service_main.py /home/freetak/FreeTAKServer/core/services/RestAPI.py && exec /home/freetak/docker-run.sh"
    volumes:
      - free-tak-core-db:/opt/fts/
    ports:
      - 8080:8080
      - 8087:8087
      - 8089:8089
      - 8443:8443
      - 9000:9000
      - 19023:19023
    environment:
        FTS_FED_PASSWORD: "${FTS_FED_PASSWORD}"
        FTS_CLIENT_CERT_PASSWORD: "${FTS_CLIENT_CERT_PASSWORD}"
        FTS_WEBSOCKET_KEY: "${FTS_WEBSOCKET_KEY}"
        FTS_SECRET_KEY: "${FTS_SECRET_KEY}"
        FTS_CONNECTION_MESSAGE: "Welcome to FreeTAKServer. The Parrot is not dead. It's just resting"
        FTS_COT_PORT: "8087"
        FTS_SSLCOT_PORT: "8089"
        FTS_API_PORT: "19023"
        FTS_FED_PORT: "9000"
        FTS_DP_ADDRESS: "freetakserver"
        FTS_USER_ADDRESS: "freetakserver"
        FTS_API_ADDRESS: "freetakserver"
        FTS_ROUTING_PROXY_SUBSCRIBE_PORT: "19030"
        FTS_ROUTING_PROXY_SUBSCRIBE_IP: "freetakserver"
        FTS_ROUTING_PROXY_PUBLISHER_PORT: "19032"
        FTS_ROUTING_PROXY_PUBLISHER_IP: "freetakserver"
        FTS_ROUTING_PROXY_SERVER_PORT: "19031"
        FTS_ROUTING_PROXY_SERVER_IP: "freetakserver"
        FTS_INTEGRATION_MANAGER_PULLER_PORT: "19033"
        FTS_INTEGRATION_MANAGER_PULLER_ADDRESS: "freetakserver"
        FTS_INTEGRATION_MANAGER_PUBLISHER_PORT: "19034"
        FTS_INTEGRATION_MANAGER_PUBLISHER_ADDRESS: "freetakserver"
        FTS_OPTIMIZE_API: "true"
        FTS_DATA_RECEPTION_BUFFER: "1024"
        FTS_MAX_RECEPTION_TIME: "4"
        FTS_NUM_ROUTING_WORKERS: "3"
        FTS_COT_TO_DB: "True"
        FTS_MAINLOOP_DELAY: "100"
        FTS_EMERGENCY_RADIUS: "0"
        FTS_LOG_LEVEL: "info"

  freetakserver-ui:
    image: ghcr.io/freetakteam/ui:latest
    hostname: freetakserver-ui
    restart: unless-stopped
    networks:
        - taknet
    ports:
      - 5000:5000
    # The image never creates /home/freetak/data itself, and the named volume
    # below (mounted at the parent dir) doesn't get it either since it isn't
    # part of the image's baked-in home dir content. SQLite can create the DB
    # file but not the missing parent dir, so the UI 500s on every request
    # until this dir exists. mkdir it before handing off to the real entrypoint.
    #
    # FTS_IP below is the public hostname (needed so the browser's own
    # Socket.IO connection, baked into index.html as {{ip}}:{{port}}, can
    # reach the API once 19023 is forwarded through the router). But this
    # container's own server-side proxy calls (login, mission, etc.) also use
    # FTS_IP, and going out to the public hostname and back in relies on the
    # router supporting NAT hairpin, which isn't guaranteed. extra_hosts below
    # overrides that one hostname inside this container only, pointing it
    # straight at freetakserver's static taknet IP instead.
    command: sh -c "mkdir -p /home/freetak/data && exec /home/freetak/docker-run.sh"
    extra_hosts:
      - "paytons-mc-server.duckdns.org:172.28.0.2"
    volumes:
      - free-tak-ui-db:/home/freetak/:Z,rw
    environment:
      FTS_IP: "paytons-mc-server.duckdns.org"
      FTS_API_PORT: "19023"
      FTS_API_PROTO: "http"
      FTS_UI_EXPOSED_IP: "freetakserver-ui"
      FTS_MAP_EXPOSED_IP: "127.0.0.1"
      FTS_MAP_PORT: "8000"
      FTS_MAP_PROTO: "http"
      FTS_UI_PORT: "5000"
      FTS_UI_WSKEY: "${FTS_WEBSOCKET_KEY}"
      FTS_API_KEY: "Bearer ${FTS_API_TOKEN}"
      FTS_UI_SQLALCHEMY_DATABASE_URI: "sqlite:////home/freetak/data/FTSServer-UI.db"

volumes:
  free-tak-core-db:
  free-tak-ui-db:

networks:
    taknet:
        driver: bridge
        ipam:
            config:
                - subnet: 172.28.0.0/24
